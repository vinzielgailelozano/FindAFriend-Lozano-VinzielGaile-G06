{% extends "base.html" %}
{% block title %}{{ title }} · FindAFriend{% endblock %}
{% block content %}
  <section class="card narrow confirm-card">
    <h1>{{ title }}</h1>
    <p class="muted">{{ text }}</p>
    <form method="post" class="form-actions start">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">{{ button }}</button>
      <a class="btn btn-ghost" href="{% url back_url %}">Go back</a>
    </form>
  </section>
{% endblock %}
