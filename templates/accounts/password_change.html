{% extends "base.html" %}
{% block title %}Change Password · FindAFriend{% endblock %}
{% block content %}
  <header class="page-head">
    <div>
      <p class="eyebrow"><a href="{% url 'accounts:profile' %}">My Profile</a> /</p>
      <h1>Change password</h1>
    </div>
  </header>
  <section class="card narrow">
    <form method="post" novalidate class="form">
      {% csrf_token %}
      {% include "_form_fields.html" %}
      <div class="form-actions">
        <a class="btn btn-ghost" href="{% url 'accounts:profile' %}">Cancel</a>
        <button type="submit" class="btn btn-primary">Update password</button>
      </div>
    </form>
  </section>
{% endblock %}
